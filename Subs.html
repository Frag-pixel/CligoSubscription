
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription</title>

    <style>
        body {
            background-color: whitesmoke;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        /* Main subscription card */
        #bord {
            width: 350px;
            height: 450px;
            background-color: white;
            border-radius: 40px;
            box-shadow: 0 0 25px rgb(0, 58, 173);
            position: relative;
            overflow: hidden;
        }

        /* Blue header */
        #border {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 210px;
            background-color: blue;
            border-radius: 40px 40px 0 0;
        }

        /* Blue strip */
        #border1 {
            position: absolute;
            top: 180px;
            left: 0;
            width: 100%;
            height: 30px;
            background-color: blue;
        }

        /* Logo */
        #logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            border-radius: 50%;
            border: 5px solid aqua;
            box-shadow: 0 0 20px aqua;
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
        }

        /* Name and description */
        #name {
            position: absolute;
            top: 260px;
            width: 100%;
            text-align: center;
            margin: 0;
            font-size: 26px;
        }

        #description {
            position: absolute;
            top: 305px;
            width: 100%;
            text-align: center;
            margin: 0;
            color: gray;
            font-size: 15px;
        }

        /* Social media buttons */
        .social-button {
            position: absolute;
            top: 355px;
            width: 55px;
            height: 45px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }

        .social-button:hover {
            transform: scale(1.12);
        }

        /* YouTube */
        #yt {
            left: 95px;
            background-color: red;
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.5);
        }

        .youtube-play {
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 16px solid white;
            margin-left: 4px;
        }

        /* TikTok */
        #tikt {
            left: 200px;
            background-color: black;
            border: 2px solid aqua;
            box-shadow: 0 0 12px aqua;
        }

        .tiktok-note {
            font-size: 30px;
            font-weight: bold;
            color: white;
            text-shadow: -2px 0 #00f2ea, 2px 0 #ff0050;
        }

    </style>
</head>

<body>

    <div id="bord">
        <div id="border"></div>
        <div id="border1"></div>

        <img src="logo.jpg.jpeg" id="logo" alt="Cligo Logo">

        <h3 id="name">Cligo</h3>
        <p id="description">Clipper &amp; Editor</p>

        <!-- YouTube button -->
        <button
            class="social-button"
            id="yt"
            onclick="window.open('https://www.youtube.com/@Clipgo.K', '_blank')"
            aria-label="Visit YouTube">
            <span class="youtube-play"></span>
        </button>

        <!-- TikTok button -->
        <button
            class="social-button"
            id="tikt"
            onclick="window.open('https://www.tiktok.com/@clippingo_')"
            aria-label="Visit TikTok">
            <span class="tiktok-note">♪</span>
        </button>

    </div>

</body>
</html>
